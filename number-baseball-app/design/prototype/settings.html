<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/proto.css">
<style>
  .scroll { flex: 1 1 auto; overflow: hidden; }
  .sec-head { height: 48px; }
  .scroll > .sec-head:first-child { height: 40px; }
  .row .rt .t.danger { color: var(--c-out); }
  .row .ext { color: var(--c-text3); width: 20px; height: 20px; }
  .acct { padding: 4px 16px 12px; display: flex; align-items: baseline; gap: 2px; }
  .acct .pname { font: var(--t-title); }
</style>
<script src="js/strings.js"></script>
<script src="js/icons.js"></script>
<script src="js/proto.js"></script>
<script>
window.build = function (qs) {
  const t = P.t;
  const nav = (ic, k, sub, val, extra = '') => `<button class="row${sub ? '' : ' single'}" style="width:100%;text-align:left">${P.icon(ic, 'ic lead')}<span class="rt"><span class="t${extra}">${t(k)}</span>${sub ? `<span class="s">${t(sub)}</span>` : ''}</span>${val ? `<span class="val">${val}</span>` : ''}${P.icon('chevron_right', 'ic chev')}</button>`;
  const ext = (ic, k) => `<button class="row single" style="width:100%;text-align:left">${P.icon(ic, 'ic lead')}<span class="rt"><span class="t">${t(k)}</span></span>${P.icon('open_in_new', 'ic ext')}</button>`;
  const vol = (k, v, on) => `<div class="vol${on ? '' : ' off'}" role="slider" aria-label="${t(k)}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><span class="slider${on ? '' : ' off'}"><span class="tr"></span><span class="fi" style="width:${v}%"></span><span class="th" style="left:${v}%"></span></span><span class="v">${v}</span></div>`;
  const sw = (ic, k, sub, on) => `<div class="row" role="switch" aria-checked="${on}">${P.icon(ic, 'ic lead')}<span class="rt"><span class="t">${t(k)}</span>${sub ? `<span class="s">${t(sub)}</span>` : ''}</span><span class="switch${on ? ' on' : ''}"></span></div>`;
  // Remove ads (11 §1 "구매"): ?ads=done|pending|error; default = not purchased, price loaded from Play.
  const ads = qs.get('ads') || '';
  const purchase = () => {
    const lead = P.icon('ad_off', 'ic lead');
    const restore = `<button class="row" style="width:100%;text-align:left">${P.icon('history', 'ic lead')}<span class="rt"><span class="t">${t('restore')}</span><span class="s">${t('restoreSub')}</span></span></button>`;
    if (ads === 'done') return `<div class="row" aria-label="${t('removeAds')}, ${t('removeAdsDone')}">${lead}<span class="rt"><span class="t">${t('removeAds')}</span><span class="s">${t('removeAdsDone')}</span></span>${P.icon('check_circle', 'ic lead')}</div>`;
    if (ads === 'pending') return `<div class="row">${lead}<span class="rt"><span class="t">${t('removeAds')}</span><span class="s">${t('removeAdsPending')}</span></span>${P.icon('hourglass_empty', 'ic lead')}</div>${restore}`;
    if (ads === 'error') return `<div class="row">${lead}<span class="rt"><span class="t">${t('removeAds')}</span><span class="s" style="color:var(--c-strike)">${t('removeAdsError')}</span></span><button class="iconbtn dim" style="margin-right:-12px" aria-label="${t('retry')}">${P.icon('refresh')}</button></div>${restore}`;
    return `<button class="row" style="width:100%;text-align:left">${lead}<span class="rt"><span class="t">${t('removeAds')}</span><span class="s">${t('removeAdsSub')}</span></span><span class="val">${t('price')}</span></button>${restore}`;
  };
  document.getElementById('app').innerHTML = `
    <div class="sysbar"></div>
    <header class="topbar">
      <button class="iconbtn" aria-label="back">${P.icon('arrow_back')}</button>
      <span class="tb-title">${t('settings')}</span>
    </header>
    <div class="scroll">
      <div class="sec-head"><span class="sec-label">${t('secGame')}</span></div>
      <div class="list">
        ${nav('language', 'language', null, t('languageVal'))}
      </div>
      <div class="sec-head"><span class="sec-label">${t('secSound')}</span></div>
      <div class="list">
        ${sw('volume_up', 'sfx', 'sfxSub', true)}
        ${vol('sfxVol', 70, true)}
        ${sw('do_not_disturb_on', 'followSilent', 'followSilentSub', true)}
        ${sw('music_note', 'music', 'musicSub', false)}
        ${vol('musicVol', 40, false)}
        ${sw('mobile_vibrate', 'haptics', 'hapticsSub', true)}
      </div>
      <div class="sec-head"><span class="sec-label">${t('secChat')}</span></div>
      <div class="list">
        ${sw('notifications_off', 'muteChat', 'muteChatSub', false)}
        ${nav('block', 'blocked', null, t('blockedVal'))}
      </div>
      <div class="sec-head"><span class="sec-label">${t('secAccount')}</span></div>
      <div class="list">
        ${nav('person', 'nickname', null, '새벽투수<span class="ptag">#4821</span>')}
        ${nav('key', 'transfer', 'transferSub')}
        ${nav('delete', 'deleteAcc', 'deleteSub', '', ' danger')}
      </div>
      <div class="sec-head" id="purchase"><span class="sec-label">${t('secPurchase')}</span></div>
      <div class="list">${purchase()}</div>
      <div class="sec-head"><span class="sec-label">${t('secAbout')}</span></div>
      <div class="list">
        ${qs.get('ump') === '0' ? '' : nav('shield', 'privacyOptions', 'privacyOptionsSub')}
        ${nav('policy', 'privacyPolicy')}
        ${nav('description', 'terms')}
        <div class="row">${P.icon('send', 'ic lead')}<span class="rt"><span class="t">${t('contact')}</span><span class="s" style="font:var(--t-body);color:var(--c-text2)">${t('contactSub')}</span></span><button class="iconbtn dim" style="margin-right:-12px" aria-label="${t('copy')}">${P.icon('content_copy')}</button></div>
        ${nav('info', 'licences')}
        <div class="row single noicon" style="padding-left:56px">${''}<span class="rt"><span class="t" style="font:var(--t-body);color:var(--c-text3)">${t('version')}</span></span><span class="val num" style="font:var(--t-num-tag);color:var(--c-text3)">1.0.0 (1)</span></div>
      </div>
    </div>
    <div class="gesture"></div>`;
  if (qs.get('scroll')) { const sc = document.querySelector('.scroll'); document.querySelector('.topbar').classList.add('scrolled'); document.querySelector('.sysbar').classList.add('scrolled'); requestAnimationFrame(() => { sc.scrollTop = qs.get('scroll') === 'end' ? sc.scrollHeight : qs.get('scroll') === 'ads' ? document.getElementById('purchase').offsetTop - sc.offsetTop - 64 : +qs.get('scroll'); }); }
};
</script>
</head>
<body>
<div class="app" id="app"></div>
</body>
</html>
