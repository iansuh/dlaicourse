<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick match search</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/proto.css">
<style>
  .pick { flex: none; padding: 8px 16px 0; }
  .center { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 0 24px; }
  .sweep { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; }
  .sweep span { height: 64px; border-radius: var(--r-m); background: var(--c-surface2); display: grid; place-items: center; font: var(--t-num-slot); color: var(--c-text-disabled); }
  .sweep span.on { color: var(--c-chalk); }
  .center h1 { font: var(--t-title); }
  .center p { font: var(--t-caption); color: var(--c-text3); }
  .elapsed { font: var(--t-num-timer); color: var(--c-text2); font-feature-settings: "tnum" 1; }
  .scan { display: flex; gap: 6px; isolation: isolate; }
  .found .sweep span { color: var(--c-chalk); }
  .vs { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .vs .k { font: var(--t-num-label); letter-spacing: .12em; color: var(--c-text3); }
  .vs .pname { font: var(--t-headline); }
  .vs .ptag { font-size: 22px; line-height: 34px; }
  .actions { flex: none; padding: 16px 16px 24px; }
  .cap2 { font: var(--t-label-small); color: var(--c-text3); margin-bottom: 8px; display: block; }
</style>
<script src="js/strings.js"></script>
<script src="js/icons.js"></script>
<script src="js/proto.js"></script>
<script>
const Q = {
  ko: { title: '상대를 찾는 중', tip: '보통 30초 안에 찾아요. 다른 앱을 봐도 찾기는 계속돼요.', cancel: '찾기 취소', found: '상대를 찾았어요', starting: '곧 비밀 숫자를 정해요', pick: '자리수 (바꾸면 다시 찾아요)' },
  en: { title: 'Finding an opponent', tip: 'Usually under 30 s. Searching continues if you switch apps.', cancel: 'Cancel search', found: 'Opponent found', starting: 'Pick your secret number next', pick: 'Digits (changing restarts the search)' }
};
window.build = function (qs) {
  const c = Q[P.lang] || Q.en, found = qs.get('state') === 'found';
  const seg = [3, 4, 5, 6].map((n) => `<button role="radio" aria-checked="${n === 4}">${P.digitsLabel(n)}</button>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="sysbar"></div>
    <header class="topbar"><button class="iconbtn" aria-label="${c.cancel}">${P.icon('close')}</button><span class="tb-title">${P.t('modeQuick')}</span></header>
    <section class="pick"><span class="cap2">${c.pick}</span><div class="seg" role="radiogroup">${seg}</div></section>
    <section class="center${found ? ' found' : ''}">
      ${found ? `
        <div class="vs"><span class="k">VS</span><span class="pname">Kestrel<span class="ptag">#2048</span></span></div>
        <span class="scan">${'<span class="lamp l on ch"></span>'.repeat(3)}</span>
        <h1>${c.found}</h1><p>${c.starting}</p>` : `
        <div class="sweep" aria-hidden="true"><span class="on">?</span><span>?</span><span>?</span><span>?</span></div>
        <span class="scan" aria-hidden="true"><span class="lamp on ch"></span><span class="lamp"></span><span class="lamp"></span></span>
        <h1>${c.title}</h1>
        <span class="elapsed" role="timer">0:07</span>
        <p>${c.tip}</p>`}
    </section>
    <section class="actions">${found ? '' : `<button class="btn btn-secondary">${c.cancel}</button>`}</section>
    <div class="gesture"></div>`;
};
</script>
</head>
<body>
<div class="app" id="app"></div>
</body>
</html>
