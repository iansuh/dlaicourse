<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/proto.css">
<style>
  .h-head { flex: none; height: 56px; display: flex; align-items: center; padding: 0 4px 0 16px; gap: 12px; }
  .brand { flex: 1; min-width: 0; display: flex; flex-direction: column; } /* localized app name, system font */
  .brand .n { font: var(--t-subtitle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .s { font: var(--t-caption); color: var(--c-text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dialog { position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); background: var(--c-surface3); border-radius: var(--r-l); box-shadow: var(--shadow-3); padding: 24px 24px 16px; }
  .dialog .dic { color: var(--c-strike); margin-bottom: 16px; }
  .dialog h2 { font: var(--t-title); }
  .dialog p { font: var(--t-body); color: var(--c-text2); margin-top: 12px; }
  .dialog .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
  .hero { flex: none; padding: 12px 16px 0; }
  .hero .cap { font: var(--t-caption); color: var(--c-text3); }
  .hero .pname { font: var(--t-title); display: block; margin-top: 2px; }
  .hero .ptag { font-size: 18px; line-height: 28px; }
  .record { display: flex; align-items: flex-end; margin-top: 16px; }
  .record > div { display: flex; flex-direction: column; gap: 2px; padding-right: 20px; }
  .record > div + div { padding-left: 20px; border-left: 1px solid var(--c-line); }
  .record .v { font: var(--t-num-stat); font-feature-settings: "tnum" 1; }
  .record .v.sm { color: var(--c-text2); }
  .record .k { font: var(--t-caption); color: var(--c-text3); }
  .formrow { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .formrow .cap { flex: none; }
  .spacer { flex: 1 1 auto; min-height: 16px; }
  .scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .scroller.tight .formrow { display: none; }
  .modes .sec-head { padding-left: 16px; }
  .row .lead-box { width: 40px; height: 40px; border-radius: var(--r-m); background: var(--c-surface2); display: grid; place-items: center; color: var(--c-chalk); flex: none; }
  .row + .row::before { left: 72px; }
  .dock { flex: none; padding: 16px 16px 24px; margin-top: 8px; border-top: 1px solid var(--c-line); background: var(--c-surface1); display: flex; flex-direction: column; gap: 12px; }
  .dock .dh .t { font: var(--t-subtitle); display: block; }
  .dock .dh .s { font: var(--t-caption); color: var(--c-text3); display: block; margin-top: 2px; }
</style>
<script src="js/strings.js"></script>
<script src="js/icons.js"></script>
<script src="js/proto.js"></script>
<script>
window.build = function (qs) {
  if (qs.get('ad') === 'none') document.querySelector('.adslot').remove();
  document.querySelectorAll('.seg [data-n]').forEach((b) => { b.innerHTML = P.digitsLabel(+b.dataset.n); });
  document.querySelector('.h-head').insertAdjacentHTML('afterbegin', P.mark());
  if (qs.get('state') === 'deletion') {
    const t = P.t;
    document.querySelector('.app').insertAdjacentHTML('beforeend', `<div class="scrim"></div><section class="dialog" role="alertdialog"><span class="dic">${P.icon('error')}</span><h2>${t('delReqT')}</h2><p>${t('delReqP')}</p><div class="acts"><button class="btn btn-primary">${t('delCancel')}</button><button class="btn btn-text danger" style="width:100%;height:48px;font:var(--t-label)">${t('delNow')}</button></div></section>`);
  }
  // Fit rule: if the upper area overflows, hide the form row first; if it still overflows, it scrolls.
  requestAnimationFrame(() => { const sc = document.querySelector('.scroller'); if (sc.scrollHeight > sc.clientHeight + 1) sc.classList.add('tight'); });
  const form = 'WWLWDLWWLW'; // oldest -> newest
  document.querySelector('.form').innerHTML = form.split('').map((r) => `<span class="lamp ${r === 'W' ? 'on st' : r === 'D' ? 'draw' : ''}"></span>`).join('');
};
</script>
</head>
<body>
<div class="app">
  <div class="sysbar"></div>
  <header class="h-head">
    <span class="brand"><span class="n" data-t="appName"></span><span class="s" data-t="appSub"></span></span>
    <button class="iconbtn dim" data-icon="help" data-al="howTo"></button>
    <button class="iconbtn dim" data-icon="settings" data-al="settings"></button>
  </header>

  <div class="scroller">
  <section class="hero">
    <span class="cap" data-t="record"></span>
    <span class="pname">새벽투수<span class="ptag">#4821</span></span>
    <div class="record">
      <div><span class="v">12</span><span class="k" data-t="win"></span></div>
      <div><span class="v">8</span><span class="k" data-t="loss"></span></div>
      <div><span class="v">3</span><span class="k" data-t="draw"></span></div>
      <div><span class="v sm">52%</span><span class="k" data-t="winRate"></span></div>
    </div>
    <div class="formrow"><span class="cap" data-t="recentForm"></span><span class="form" role="img" aria-label="승 승 패 승 무 패 승 승 패 승"></span></div>
  </section>

  <div class="spacer"></div>

  <nav class="modes">
    <div class="sec-head"><span class="sec-label" data-t="otherModes"></span></div>
    <div class="list">
      <button class="row" style="width:100%;text-align:left">
        <span class="lead-box" data-icon="memory"></span>
        <span class="rt"><span class="t" data-t="cpuTitle"></span><span class="s" data-t="cpuSub"></span></span>
        <span data-icon="chevron_right" data-icon-cls="ic chev"></span>
      </button>
      <button class="row" style="width:100%;text-align:left">
        <span class="lead-box" data-icon="group"></span>
        <span class="rt"><span class="t" data-t="roomTitle"></span><span class="s" data-t="roomSub"></span></span>
        <span data-icon="chevron_right" data-icon-cls="ic chev"></span>
      </button>
      <button class="row" style="width:100%;text-align:left">
        <span class="lead-box" data-icon="login"></span>
        <span class="rt"><span class="t" data-t="joinTitle"></span><span class="s" data-t="joinSub"></span></span>
        <span data-icon="chevron_right" data-icon-cls="ic chev"></span>
      </button>
    </div>
  </nav>
  </div>

  <section class="dock">
    <div class="dh"><span class="t" data-t="quickTitle"></span><span class="s" data-t="quickSub"></span></div>
    <div class="seg" role="radiogroup">
      <button role="radio" aria-checked="true" data-n="3"></button>
      <button role="radio" aria-checked="false" data-n="4"></button>
      <button role="radio" aria-checked="false" data-n="5"></button>
      <button role="radio" aria-checked="false" data-n="6"></button>
    </div>
    <button class="btn btn-primary" data-icon="bolt"><span data-t="quickStart"></span></button>
  </section>

  <div class="adslot"><div class="creative"><i>AD</i>Sample banner creative · adaptive 360×50</div></div>
  <div class="gesture"></div>
</div>
</body>
</html>
