<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/proto.css">
<style>
  .h-head { flex: none; min-height: 56px; display: flex; align-items: center; padding: 0 4px 0 16px; gap: 10px; }
  .brand { flex: 1; min-width: 0; display: flex; flex-direction: column; } /* localized app name, system font */
  .brand .n { font: var(--t-subtitle); font-size: calc(17px * var(--fs, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .s { font: var(--t-caption); color: var(--c-text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 0 16px; overflow: hidden; }
  .me { flex: none; display: flex; align-items: center; gap: 12px; padding: 16px 0 8px; text-align: left; width: 100%; }
  .me .pname { font: var(--t-subtitle); font-size: calc(17px * var(--fs, 1)); display: flex; min-width: 0; }
  .me .cap { font: var(--t-caption); color: var(--c-text3); }
  .stats { flex: none; display: flex; justify-content: space-between; margin-top: 12px; padding: 0 4px 20px; border-bottom: 1px solid var(--c-line); }
  .stat .v { font: var(--t-num-stat); letter-spacing: var(--t-num-stat-track); }
  .stat .v small { font-size: .7em; }
  .stat .k { font: var(--t-caption); color: var(--c-text3); }
  .hero { flex: none; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .hero .slots { margin: 0; gap: 8px; }
  .hero .slot { width: 56px; }
  .hero .link { min-height: 40px; }
  .body.tight .hero { display: none; }
  .modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .mode { min-height: var(--z-mode-tile-h); border-radius: var(--r-m); box-shadow: inset 0 0 0 var(--z-border) var(--c-line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; text-align: center; font: var(--t-label-small); font-size: calc(14px * var(--fs, 1)); line-height: 1.3; color: var(--c-ink); }
  .modes-label { display: block; margin: 0 0 10px 4px; }
  .quick { flex: none; margin-top: 24px; }
  .quick-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 4px 10px; }
  .quick-head .t { font: var(--t-subtitle); }
  .quick-head .s { font: var(--t-caption); color: var(--c-text3); text-align: right; }
  .quick .seg { margin-bottom: 12px; }
  .foot { flex: none; height: var(--l-banner-clear-space); }
</style>
<script src="js/strings.js"></script>
<script src="js/icons.js"></script>
<script src="js/proto.js"></script>
<script>
window.build = function (qs) {
  if (qs.get('ad') === 'none') document.querySelector('.adslot').remove();
  document.querySelectorAll('.seg [data-n]').forEach((b) => { b.innerHTML = P.digitsLabel(+b.dataset.n); });
  document.querySelector('.h-head').insertAdjacentHTML('afterbegin', P.mark());
  document.querySelector('.hero').insertAdjacentHTML('afterbegin', P.slotsHtml(4, ['?', '?', '?', '?'], { cls: 'q' }).replace(/ filled/g, ''));
  // Fit rule (02): if the body overflows, the "? ? ? ?" hero hides first; then the body scrolls above the pinned quick-match block.
  requestAnimationFrame(() => { const b = document.querySelector('.body'); if (b.scrollHeight > b.clientHeight + 1) b.classList.add('tight'); });
};
</script>
</head>
<body>
<div class="app">
  <div class="sysbar"></div>
  <header class="h-head">
    <span class="brand"><span class="n" data-t="appName"></span><span class="s" data-t="appSub"></span></span>
    <button class="iconbtn" data-icon="help" data-al="howTo"></button>
    <button class="iconbtn" data-icon="settings" data-al="settings"></button>
  </header>

  <div class="body">
    <button class="me" data-al="profile">
      <span class="avatar">새</span>
      <span style="min-width:0;display:flex;flex-direction:column">
        <span class="pname"><span class="ellipsis">새벽투수</span><span class="ptag">#4821</span></span>
        <span class="cap" data-t="record"></span>
      </span>
    </button>
    <div class="stats">
      <div class="stat"><div class="v num">12</div><div class="k" data-t="win"></div></div>
      <div class="stat"><div class="v num">8</div><div class="k" data-t="loss"></div></div>
      <div class="stat"><div class="v num">3</div><div class="k" data-t="draw"></div></div>
      <div class="stat"><div class="v num">52<small>%</small></div><div class="k" data-t="winRate"></div></div>
    </div>
    <div class="spacer" style="min-height:16px"></div>
    <div class="hero"><button class="link"><span data-t="firstTime"></span><span data-icon="chevron_right"></span></button></div>
    <div class="spacer" style="min-height:16px"></div>
    <span class="sec-label modes-label" data-t="otherModesShort"></span>
    <nav class="modes">
      <button class="mode" data-icon="memory"><span data-t="cpuTile"></span></button>
      <button class="mode" data-icon="group"><span data-t="roomTile"></span></button>
      <button class="mode" data-icon="login"><span data-t="joinTile"></span></button>
    </nav>
    <section class="quick">
      <div class="quick-head"><span class="t" data-t="quickTitle"></span><span class="s" data-t="quickMeta"></span></div>
      <div class="seg tall" role="radiogroup">
        <button role="radio" aria-checked="false" data-n="3"></button>
        <button role="radio" aria-checked="true" data-n="4"></button>
        <button role="radio" aria-checked="false" data-n="5"></button>
        <button role="radio" aria-checked="false" data-n="6"></button>
      </div>
      <button class="btn btn-primary"><span data-t="quickStart"></span></button>
    </section>
    <div class="foot"></div>
  </div>

  <div class="adslot"><div class="creative"><i>AD</i>Sample banner creative · adaptive 360×50</div></div>
  <div class="gesture"></div>
</div>
</body>
</html>
