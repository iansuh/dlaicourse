<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/proto.css">
<style>
  .memo-toggle, .opp-compact { display: none !important; }
  /* Compact window (height < 480dp): one-screen layout without memo, 6-column keypad. */
  @media (max-height: 479px) {
    .sysbar, .gesture, .duel, .memo, .log-head { display: none; }
    .topbar { height: 48px; }
    .m-top .mode { display: none; }
    .log { border-top: 1px solid var(--c-line); }
    .log-row { height: 40px; }
    .log-row.latest { height: 48px; }
    .log-row.latest .cell-stack .lamps { display: none; }
    .log-row.latest .g { font: var(--t-num-log); letter-spacing: var(--t-num-log-track); }
    .log { --log-cols: 24px minmax(0, 1fr) 40px 40px 64px; }
    .log-row { padding: 0 12px; }
    .entry { padding: 8px 12px 8px; gap: 8px; flex-direction: column; }
    .slot { height: var(--z-slot-h-compact); font: var(--t-num-slot-sm); width: 48px; }
    .slot.active::after { bottom: 8px; }
    .keypad.full { display: none; }
    .keypad.compact { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 64px; gap: 4px; }
    .keypad.compact .key { height: 48px; font-size: 26px; }
    .keypad.compact .key.pitch { grid-column: auto; font: var(--t-label-small); padding: 0 4px; }
    .memo-toggle { display: grid !important; }
    .opp-compact { display: flex !important; }
  }
  .opp-compact { align-items: center; gap: 6px; font: var(--t-caption); color: var(--c-text2); white-space: nowrap; overflow: hidden; }
  .opp-compact .lamp { width: 6px; height: 6px; }
  .secret-legend { flex: none; border-top: 1px solid var(--c-line); }
  .secret-legend .log-head { display: flex; }
  .secret-legend .lg-row { display: grid; grid-template-columns: 56px 1fr; align-items: center; height: var(--z-history-row-h); padding: 0 16px; border-top: 1px solid var(--c-line); }
  .secret-legend .lg-row .k { display: flex; align-items: center; gap: 6px; }
  .secret-legend .lg-row .k .hint { font: var(--t-num-hint); }
  .secret-legend .lg-row .d { font: var(--t-caption); color: var(--c-text2); }
  .secret-legend .lg-row .d b { color: var(--c-chalk); font-weight: 700; }
  .secret-head { padding: 24px 16px 4px; text-align: center; }
  .secret-head h1 { font: var(--t-title); }
  .secret-head p { font: var(--t-caption); color: var(--c-text3); margin-top: 4px; }
  .secret-opp { display: flex; align-items: center; justify-content: center; gap: 8px; font: var(--t-caption); color: var(--c-text2); padding: 8px 0 0; }
  .spacer { flex: 1 1 auto; }
</style>
<script src="js/strings.js"></script>
<script src="js/icons.js"></script>
<script src="js/proto.js"></script>
<script>
window.build = function (qs) {
  const t = P.t, state = qs.get('state') || 'guess', n = +(qs.get('digits') || 4);
  const m = {
    secretOpp: '3916', secretMine: '0472',
    mine: ['1234', '5780', '3196'],
    theirs: ['5832', '0291', '0724'],
    entry: (qs.get('entry') || '39').split('').filter(Boolean),
    memo: { '0': 'x', '2': 'x', '4': 'x', '5': 'x', '7': 'x', '8': 'x', '1': 'o', '3': 'o', '6': 'o', '9': 'o', '1:1': 'x', '3:3': 'x', '1:3': 'o', '2:1': 'x', '4:9': 'x' }
  };
  if (state === 'late' || state === 'phrases') {
    m.mine = ['1234', '5780', '3196', '3169', '3961', '3912'];
    m.theirs = ['5832', '0291', '0724', '0742', '0427', '0471'];
    m.entry = (qs.get('entry') || '391').split('');
    m.memo = { '0': 'x', '2': 'x', '4': 'x', '5': 'x', '7': 'x', '8': 'x', '1': 'o', '3': 'o', '6': 'o', '9': 'o', '1:3': 'o', '2:9': 'o', '3:1': 'o', '4:2': 'x', '4:6': 'o', '1:1': 'x', '3:3': 'x' };
  }
  if (n !== 4) { m.secretOpp = '391652'.slice(0, n); m.secretMine = '047281'.slice(0, n); m.mine = ['123456'.slice(0, n), '578042'.slice(0, n), '319620'.slice(0, n)]; m.theirs = ['583219'.slice(0, n), '029153'.slice(0, n), '072418'.slice(0, n)]; m.memo = { '7': 'x', '8': 'x', '1': 'o', '3': 'o' }; }
  const app = document.getElementById('app');
  const clockCls = qs.get('clock') || (state === 'reconnect' ? 'paused' : '');
  const clockVal = clockCls === 'warn' ? '0:08' : clockCls === 'crit' ? '0:04' : '0:42';
  const clockPct = clockCls === 'warn' ? 13 : clockCls === 'crit' ? 7 : 70;
  const roundNo = state === 'secret' ? 0 : m.mine.length + 1;
  const top = `
    <header class="topbar m-top">
      <button class="iconbtn" aria-label="${t('leave')}">${P.icon('close')}</button>
      <div class="tb-stack"><span class="round">${state === 'secret' ? t('modeQuick') : t('round', { n: roundNo })}</span><span class="mode">${state === 'secret' ? t('digitsN', { n }) : t('modeQuick') + ' · ' + t('digitsN', { n })}</span><span class="opp-compact"><span class="lamp${state === 'waiting' ? '' : ' on bl'}"></span>${state === 'waiting' ? t('oppThinking') : t('oppPitched')}</span></div>
      <button class="iconbtn dim memo-toggle" aria-label="${t('memoShow')}">${P.icon('edit_note')}</button>
      <div class="clock ${clockCls}" role="timer" aria-label="${t('timeLeft')}">${P.icon('timer')}<span class="v">${clockVal}</span></div>
      <button class="iconbtn" aria-label="${t('more')}">${P.icon('more_vert')}</button>
      <div class="clockbar ${clockCls}"><i style="width:${clockPct}%"></i></div>
    </header>`;
  const duel = (status) => `
    <section class="duel">
      <span class="vs">VS</span>
      <div class="opp"><span class="pname">Kestrel<span class="ptag">#2048</span></span>
        <span class="pstatus">${status === 'pitched' ? `<span class="lamp on bl"></span>${t('oppPitched')}` : status === 'picking' ? `<span class="lamp"></span>${t('oppPicking')}` : `<span class="lamp"></span>${t('oppThinking')}`}</span></div>
      ${qs.get('mode') !== 'cpu' ? `<button class="iconbtn dim" aria-label="${t('phrases')}">${P.icon('chat')}</button>` : ''}
      ${status !== 'picking' ? `<div class="mysecret"><span class="cap">${t('mySecret')}</span><span class="miniplates">${m.secretMine.split('').map((d) => `<span>${d}</span>`).join('')}</span></div>` : ''}
    </section>`;
  if (state === 'secret') {
    const e = (qs.get('entry') || '047').split('');
    m.entry = e;
    app.innerHTML = `<div class="sysbar"></div>${top}${duel('picking')}
      <section class="secret-legend" aria-label="${t('legendTitle')}">
        <div class="log-head"><span>${t('legendTitle')}</span></div>
        <div class="lg-row"><span class="k lamps"><span class="lamp on st"></span><span class="hint h-s">1S</span></span><span class="d">${t('legS')}</span></div>
        <div class="lg-row"><span class="k lamps"><span class="lamp on bl"></span><span class="hint h-b">1B</span></span><span class="d">${t('legB')}</span></div>
        <div class="lg-row"><span class="k"><span class="h-out">OUT</span></span><span class="d">${t('legO')}</span></div>
      </section>
      <div class="spacer"></div>
      <div class="secret-head"><h1>${t('secretTitle')}</h1><p>${t('secretRule', { n })}</p></div>
      <section class="entry" style="border-top:0">
        ${P.slotsHtml(n, e)}
        ${P.keypadHtml({ ...m, memo: null }, { label: t('lockIn'), secret: true })}
      </section>
      <div class="gesture"></div>`;
    return;
  }
  const waiting = state === 'waiting';
  const phraseSheet = state === 'phrases' ? `<div class="scrim"></div><section class="sheet" style="padding-bottom:24px"><div class="grab"></div>
      <div style="display:flex;align-items:center;padding:4px 4px 0 16px"><span style="flex:1;font:var(--t-title)">${t('phrases')}</span><button class="iconbtn" aria-label="close">${P.icon('close')}</button></div>
      <p style="padding:0 16px 12px;font:var(--t-caption);color:var(--c-text3)">${t('phrasesNote')}</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px">${['ph1', 'ph2', 'ph3', 'ph4', 'ph5', 'ph6'].map((k) => `<button class="btn btn-tonal" style="height:48px">${t(k)}</button>`).join('')}</div>
    </section>` : '';
  if (waiting) m.entry = ['3', '9', '6', '1'];
  const recon = state === 'reconnect' ? `<div class="conn" role="status"><span class="lamps"><span class="lamp on ch"></span><span class="lamp"></span><span class="lamp"></span></span><span class="tx"><b>${t('reconnecting')}</b><span>${t('reconnectSub', { s: '0:48' })}</span></span><span class="cd">0:48</span></div>` : '';
  app.innerHTML = `<div class="sysbar"></div>${top}${recon}${duel(waiting ? 'thinking' : 'pitched')}
    <section class="log${n >= 5 ? ' wide' : ''}">${P.logHtml(m)}</section>
    <section class="memo">${P.memoHtml(m)}</section>
    <section class="entry">
      ${P.slotsHtml(n, m.entry, { locked: waiting })}
      ${P.keypadHtml(m, { waiting, offline: state === 'reconnect' })}
    </section>
    <div class="gesture"></div>${phraseSheet}`;
};
</script>
</head>
<body>
<div class="app" id="app"></div>
</body>
</html>
