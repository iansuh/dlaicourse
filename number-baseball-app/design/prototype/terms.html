<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terms gate</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/proto.css">
<style>
  .body { flex: 1 1 auto; padding: 8px 16px 0; overflow: hidden; }
  .body h1 { font: var(--t-headline); }
  .body .lead { font: var(--t-body); color: var(--c-text2); margin-top: 8px; }
  .pts { margin-top: 24px; border-top: 1px solid var(--c-line); }
  .pt { display: grid; grid-template-columns: 40px 1fr; gap: 0 12px; padding: 14px 0; border-bottom: 1px solid var(--c-line); }
  .pt .ic { color: var(--c-text2); margin-top: 1px; }
  .pt b { font: var(--t-body-strong); display: block; }
  .pt span { font: var(--t-caption); color: var(--c-text3); }
  .links { display: flex; flex-direction: column; margin-top: 8px; }
  .links a { display: flex; align-items: center; gap: 8px; min-height: 48px; font: var(--t-label-small); color: var(--c-chalk); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--c-outline); }
  .links a .ic { width: 18px; height: 18px; color: var(--c-text3); }
  .ver { font: var(--t-num-tag); color: var(--c-text3); }
  .actions { flex: none; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--c-line); }
  .actions .note { font: var(--t-caption); color: var(--c-text3); text-align: center; }
</style>
<script src="js/strings.js"></script>
<script src="js/icons.js"></script>
<script src="js/proto.js"></script>
<script>
const T = {
  ko: { title: '온라인 대결 전에 약관을 확인해 주세요', lead: '모르는 사람과 대결하고 대화하는 공간이라 몇 가지 약속이 필요해요.',
    p1: '만 18세 이상', p1s: '모르는 사람과 채팅할 수 있어 성인을 위한 앱이에요.',
    p2: '서로 존중하기', p2s: '괴롭힘, 혐오 표현, 개인정보 요구, 스팸은 금지예요.',
    p3: '아동 안전은 무관용', p3s: '관련 내용은 즉시 삭제, 영구 정지, 관계 기관 신고.',
    p4: '신고와 차단', p4s: '메시지나 플레이어를 길게 눌러요. 보통 24시간 안에 조치해요.',
    full: '이용약관 전문 보기', privacy: '개인정보 처리방침', ver: '약관 버전',
    agree: '동의하고 계속', later: '나중에', note: '동의하지 않으면 컴퓨터 대결만 할 수 있어요.' },
  en: { title: 'Before you play online, review the Terms', lead: 'You will play and chat with strangers, so a few rules apply.',
    p1: '18 and over', p1s: 'You can chat with strangers, so the app is for adults.',
    p2: 'Respect other players', p2s: 'No harassment, hate speech, asking for personal data or spam.',
    p3: 'Zero tolerance on child safety', p3s: 'Removed at once, permanent ban, reported to authorities.',
    p4: 'Report and block', p4s: 'Long-press a message or player. We usually act within 24 hours.',
    full: 'Read the full Terms', privacy: 'Privacy policy', ver: 'Terms version',
    agree: 'Agree and continue', later: 'Not now', note: 'Without agreeing you can only play vs Computer.' }
};
window.build = function (qs) {
  const c = T[P.lang] || T.en;
  document.getElementById('app').innerHTML = `
    <div class="sysbar"></div>
    <header class="topbar"><button class="iconbtn" aria-label="${c.later}">${P.icon('close')}</button></header>
    <section class="body">
      <h1>${c.title}</h1>
      <p class="lead">${c.lead}</p>
      <div class="pts">
        <div class="pt">${P.icon('person')}<div><b>${c.p1}</b><span>${c.p1s}</span></div></div>
        <div class="pt">${P.icon('forum')}<div><b>${c.p2}</b><span>${c.p2s}</span></div></div>
        <div class="pt">${P.icon('shield')}<div><b>${c.p3}</b><span>${c.p3s}</span></div></div>
        <div class="pt">${P.icon('flag')}<div><b>${c.p4}</b><span>${c.p4s}</span></div></div>
      </div>
      <div class="links">
        <a>${c.full}${P.icon('open_in_new')}</a>
        <a>${c.privacy}${P.icon('open_in_new')}</a>
      </div>
      <p class="ver">${c.ver} 2026-11-v1</p>
    </section>
    <section class="actions">
      <button class="btn btn-primary">${c.agree}</button>
      <p class="note">${c.note}</p>
    </section>
    <div class="gesture"></div>`;
};
</script>
</head>
<body>
<div class="app" id="app"></div>
</body>
</html>
