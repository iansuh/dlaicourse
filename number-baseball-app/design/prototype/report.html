<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report and block</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/proto.css">
<style>
  .behind { flex: 1 1 auto; padding: 72px 16px 0; color: var(--c-text3); font: var(--t-title); }
  .sheet { padding-bottom: 8px; }
  .card-h { display: flex; align-items: center; gap: 12px; padding: 8px 16px 16px; }
  .card-h .pname { font: var(--t-title); }
  .card-h .ptag { font-size: 18px; line-height: 28px; }
  .card-h .sub { font: var(--t-caption); color: var(--c-text3); }
  .card-rec { display: flex; gap: 20px; padding: 0 16px 16px; }
  .card-rec div { display: flex; flex-direction: column; }
  .card-rec .v { font: var(--t-num-stat); font-size: 24px; line-height: 28px; font-feature-settings: "tnum" 1; }
  .rec-none { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 8px 16px 16px; font: var(--t-caption); color: var(--c-text3); margin-top: -4px; }
  .card-rec .k { font: var(--t-caption); color: var(--c-text3); }
  .sheet .row { min-height: 56px; }
  .sheet .row .lead { color: var(--c-text2); }
  .sheet .row.danger .lead, .sheet .row.danger .t { color: var(--c-danger); }
  .sh-title { padding: 4px 16px 4px; font: var(--t-title); }
  .sh-sub { padding: 0 16px 8px; font: var(--t-caption); color: var(--c-text3); }
  .radio { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--c-outline); flex: none; position: relative; }
  .radio.on { box-shadow: inset 0 0 0 2px var(--c-accent); }
  .radio.on::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--c-accent); }
  .reason { display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px; font: var(--t-body); }
  .note-field { margin: 8px 16px 0; height: 48px; border-radius: var(--r-m); background: var(--c-surface2); display: flex; align-items: center; padding: 0 12px; font: var(--t-body); color: var(--c-text3); }
  .evidence { display: flex; gap: 8px; padding: 12px 16px 0; font: var(--t-caption); color: var(--c-text3); }
  .evidence .ic { width: 16px; height: 16px; flex: none; margin-top: 1px; }
  .sh-actions { display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 16px; }
  .done { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 24px 4px; gap: 8px; }
  .done .okmark { width: 48px; height: 48px; border-radius: 50%; background: var(--c-surface2); display: grid; place-items: center; color: var(--c-ball); }
  .done h2 { font: var(--t-title); }
  .done p { font: var(--t-body); color: var(--c-text2); }
  
  .dialog h2 { font: var(--t-title); }
  .dialog p { font: var(--t-body); color: var(--c-text2); margin-top: 12px; }
  .dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
  .dialog .acts .btn { width: auto; min-height: 48px; padding: 0 16px; }
</style>
<script src="js/strings.js"></script>
<script src="js/icons.js"></script>
<script src="js/proto.js"></script>
<script>
const R = {
  ko: { team: 'B팀 · 온라인 대전 기록', noRec: '기록을 볼 수 없어요', failRec: '기록을 불러오지 못했어요', retry: '다시 시도', report: '신고하기', block: '차단하기', blockSub: '채팅이 보이지 않고 다시 매칭되지 않아요', close: '닫기',
    rTitle: 'Größenwahn#7731 신고', rSub: '이유를 하나 골라 주세요', reasons: ['욕설이나 괴롭힘', '혐오 표현', '성적인 내용', '개인정보 요구 또는 공개', '스팸이나 광고', '부정행위', '아동 안전 문제', '기타'],
    note: '자세한 내용 (선택, 최대 200자)', evidence: '신고하면 이 방의 최근 대화 20줄이 증거로 함께 저장돼요.', send: '신고 보내기',
    doneT: '신고했어요', doneP: '보통 24시간 안에 확인해요. 결과는 따로 알려 드리지 않아요.', blockToo: '이 플레이어도 차단하기',
    dT: 'Größenwahn#7731 님을 차단할까요?', dP: '서로의 채팅이 보이지 않고, 빠른 대결에서 다시 만나지 않아요. 설정 > 차단한 플레이어에서 풀 수 있어요.', cancel: '취소', blockBtn: '차단' },
  en: { team: 'Team B · online record', noRec: 'Record not available', failRec: 'Couldn’t load the record', retry: 'Try again', report: 'Report', block: 'Block', blockSub: 'Hides their chat and never matches you again', close: 'Close',
    rTitle: 'Report Größenwahn#7731', rSub: 'Pick one reason', reasons: ['Insults or harassment', 'Hate speech', 'Sexual content', 'Asking for or sharing personal data', 'Spam or ads', 'Cheating', 'Child safety', 'Something else'],
    note: 'Details (optional, up to 200)', evidence: 'The last 20 lines of this room are saved with the report as evidence.', send: 'Send report',
    doneT: 'Report sent', doneP: 'We usually review within 24 hours. You will not get a separate result.', blockToo: 'Block this player too',
    dT: 'Block Größenwahn#7731?', dP: 'You will not see each other\'s chat and will not be matched again. Undo in Settings > Blocked players.', cancel: 'Cancel', blockBtn: 'Block' }
};
window.build = function (qs) {
  const c = R[P.lang] || R.en, st = qs.get('state') || 'card';
  // Record from GET /api/v1/players/{id} (protocol 1.1 §3.4). ?rec=none: 404 (deleted, bot, or a block either way: same text, nothing revealed);
  // ?rec=loading: values as "–" in textDisabled; ?rec=fail: network error with retry.
  const r = qs.get('rec') || '';
  const stat = (v, k) => `<div><span class="v"${v === '–' ? ' style="color:var(--c-text-disabled)"' : ''}>${v}</span><span class="k">${P.t(k)}</span></div>`;
  const rec = () => r === 'none' ? `<p class="rec-none">${c.noRec}</p>`
    : r === 'fail' ? `<p class="rec-none">${c.failRec}<button class="btn-text">${c.retry}</button></p>`
    : `<div class="card-rec">${stat(r === 'loading' ? '–' : '31', 'win')}${stat(r === 'loading' ? '–' : '27', 'loss')}${stat(r === 'loading' ? '–' : '4', 'draw')}</div>`;
  let sheet = '';
  if (st === 'card') sheet = `<section class="sheet"><div class="grab"></div>
      <div class="card-h"><span class="tbadge b">B</span><div><span class="pname">Größenwahn<span class="ptag">#7731</span></span><div class="sub">${r === 'none' ? c.team.split(' · ')[0] : c.team}</div></div></div>
      ${rec()}
      <div class="list" style="border-top:1px solid var(--c-line)">
        <button class="row single" style="width:100%;text-align:left">${P.icon('flag', 'ic lead')}<span class="rt"><span class="t">${c.report}</span></span>${P.icon('chevron_right', 'ic chev')}</button>
        <button class="row danger" style="width:100%;text-align:left">${P.icon('block', 'ic lead')}<span class="rt"><span class="t">${c.block}</span><span class="s">${c.blockSub}</span></span></button>
      </div><div style="height:24px"></div></section>`;
  if (st === 'reasons') sheet = `<section class="sheet"><div class="grab"></div>
      <div class="sh-title">${c.rTitle}</div><div class="sh-sub">${c.rSub}</div>
      ${c.reasons.map((r, i) => `<div class="reason" role="radio" aria-checked="${i === 0}"><span class="radio${i === 0 ? ' on' : ''}"></span>${r}</div>`).join('')}
      <div class="note-field">${c.note}</div>
      <p class="evidence">${P.icon('info')}${c.evidence}</p>
      <div class="sh-actions"><button class="btn btn-primary">${c.send}</button></div><div style="height:8px"></div></section>`;
  if (st === 'done') sheet = `<section class="sheet"><div class="grab"></div>
      <div class="done"><span class="okmark">${P.icon('check')}</span><h2>${c.doneT}</h2><p>${c.doneP}</p></div>
      <div class="sh-actions"><button class="btn btn-secondary danger" style="box-shadow:inset 0 0 0 1.5px var(--c-danger)">${P.icon('block')}${c.blockToo}</button><button class="btn btn-tonal">${c.close}</button></div><div style="height:16px"></div></section>`;
  if (st === 'dialog') sheet = `<section class="dialog" role="alertdialog"><h2>${c.dT}</h2><p>${c.dP}</p><div class="acts"><button class="btn btn-text" style="min-height:48px;font:var(--t-label);color:var(--c-accent)">${c.cancel}</button><button class="btn btn-text danger" style="min-height:48px;font:var(--t-label)">${c.blockBtn}</button></div></section>`;
  document.getElementById('app').innerHTML = `<div class="sysbar"></div><div class="behind">${P.t('teamMatch')}</div><div class="scrim"></div>${sheet}`;
};
</script>
</head>
<body>
<div class="app" id="app"></div>
</body>
</html>
