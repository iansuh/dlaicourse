<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/proto.css">
<style>
  .hero { flex: none; padding: 8px 16px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .hero h1 { font: var(--t-display); }
  .hero p { font: var(--t-body); color: var(--c-text2); }
  .reveal { flex: none; padding: 0 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .rv { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .rv .cap { font: var(--t-caption); color: var(--c-text3); }
  .rv .slot { width: 52px; height: 60px; font: var(--t-num-slot-sm); font-size: 32px; }
  .rv.mine .slot { width: 40px; height: 44px; font: var(--t-num-log); letter-spacing: 0; background: var(--c-surface1); color: var(--c-text2); }
  .ls { flex: none; margin: 28px 16px 0; border-top: 1px solid var(--c-line); padding-top: 12px; }
  .ls .cap { font: var(--t-label-small); color: var(--c-text3); display: flex; justify-content: space-between; }
  .ls .cap .num { font: var(--t-num-tag); color: var(--c-text3); display: inline-flex; align-items: center; gap: 4px; }
  .ls .cap .num .ic { width: 16px; height: 16px; }
  .ls table { width: 100%; border-collapse: collapse; margin-top: 8px; font-feature-settings: "tnum" 1; }
  .ls th, .ls td { height: 32px; text-align: center; padding: 0; }
  .ls th { font: var(--t-num-label); letter-spacing: var(--t-num-label-track); color: var(--c-text3); font-weight: 600; }
  .ls td { font: var(--t-num-log); letter-spacing: 0; color: var(--c-chalk); vertical-align: baseline; }
  .ls td, .ls th { line-height: 32px; }
  .ls td.z { color: var(--c-text-disabled); }
  .ls td.fin { color: var(--c-strike); }
  .ls .who { width: 80px; text-align: left; font: var(--t-caption); line-height: 32px; color: var(--c-text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
  .ls .tot { width: 56px; text-align: right; font: var(--t-num-hint); }
  .ls th.tot { font: var(--t-label-small); color: var(--c-text3); }
  .ls tr + tr td { border-top: 1px solid var(--c-line); }
  /* Upper area (hero → line score) is one vertical scroll region; actions and band stay pinned (06 §1). */
  .upper { flex: 1 1 auto; min-height: 0; overflow: hidden; padding-bottom: 16px; }
  .upper.fade { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), transparent); }
  .topbar .adlink { margin-right: 0; }
  .topbar .adlink.end { margin-right: 4px; }
  .actions { flex: none; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 8px; }
  .adnote { display: flex; align-items: center; justify-content: center; gap: 6px; font: var(--t-caption); color: var(--c-text3); padding-bottom: 4px; text-align: center; }
  .adnote .ic { width: 16px; height: 16px; }
</style>
<script src="js/strings.js"></script>
<script src="js/icons.js"></script>
<script src="js/proto.js"></script>
<script>
window.build = function (qs) {
  const t = P.t, outcome = qs.get('outcome') || 'win', mode = qs.get('mode') || 'online';
  // ?ad=after: this result was reached through an interstitial (06 §3) → no banner on it. ?ads=removed: purchased, no link, no banner.
  const removed = qs.get('ads') === 'removed', afterAd = qs.get('ad') === 'after', banner = !removed && !afterAd;
  const secretOpp = '3916', secretMine = '0472';
  const mine = ['1234', '5780', '3196', '3169', '3961', '3916'];
  const theirs = outcome === 'win' ? ['5832', '0291', '0724', '0742', '0427', '0478'] : ['5832', '0291', '0724', '0742', '0427', '0472'];
  if (outcome === 'lose') mine[5] = '3961';
  const n = 4, rounds = mine.length;
  const sMine = mine.map((g) => P.judge(secretOpp, g)), sTheirs = theirs.map((g) => P.judge(secretMine, g));
  const best = sTheirs.reduce((a, h) => (h.s > a.s || (h.s === a.s && h.b > a.b) ? h : a), { s: -1, b: 0 });
  let lamps = ''; for (let i = 0; i < n; i++) lamps += `<span class="lamp l${outcome === 'win' ? ' on st' : ''}"></span>`;
  const head = { win: t('resWin'), lose: t('resLose'), draw: t('resDraw') }[outcome];
  const sub = { win: t('resWinSub', { n: rounds }), lose: t('resLoseSub', { n: rounds }), draw: t('resDrawSub', { n: rounds }) }[outcome];
  const oppName = mode === 'cpu' ? t('cpuShort') : 'Kestrel';
  const cell = (h, i, arr) => `<td class="${h.s === n ? 'fin' : h.s === 0 ? 'z' : ''}">${h.s}</td>`;
  const head9 = sMine.map((_, i) => `<th>${i + 1}</th>`).join('');
  if (outcome === 'win') document.getElementById('app').classList.add('tint-win');
  document.getElementById('app').innerHTML = `
    <div class="sysbar"></div>
    <header class="topbar">
      <button class="iconbtn" aria-label="${t('home')}">${P.icon('close')}</button>
      <span class="tb-title"></span>
      ${removed ? '' : `<button class="btn-text adlink${mode === 'online' ? '' : ' end'}">${t('removeAds')}</button>`}
      ${mode === 'online' ? `<button class="iconbtn dim" aria-label="${t('report')}">${P.icon('flag')}</button>` : ''}
    </header>
    <div class="upper">
    <section class="hero">
      <span class="lamps l" aria-hidden="true">${lamps}</span>
      <h1>${head}</h1>
      <p>${sub}</p>
    </section>
    <section class="reveal">
      <div class="rv"><span class="cap">${t('oppSecret')}</span>${P.slotsHtml(n, secretOpp.split(''), { cls: outcome === 'win' ? 'hit' : '' })}</div>
      <div class="rv mine"><span class="cap">${t('mySecret')}</span>${P.slotsHtml(n, secretMine.split(''))}</div>
    </section>
    <section class="ls">
      <div class="cap"><span>${t('lineScore')}</span><span class="num" aria-label="${t('time')} 3:12">${P.icon('timer')}3:12</span></div>
      <table aria-label="${t('lineScore')}">
        <tr><th class="who"></th>${head9}<th class="tot">${t('bestLabel')}</th></tr>
        <tr><td class="who">${t('me')}</td>${sMine.map(cell).join('')}<td class="tot">${outcome === 'win' ? `<span class="h-s">${n}S</span>` : `${Math.max(...sMine.map((h) => h.s))}S`}</td></tr>
        <tr><td class="who">${oppName}</td>${sTheirs.map(cell).join('')}<td class="tot">${best.s === n ? `<span class="h-s">${n}S</span>` : `${best.s}S`}</td></tr>
      </table>
    </section>
    </div>
    <section class="actions">
      <button class="btn btn-primary">${t('rematch')}</button>
      <button class="btn btn-secondary">${t('home')}</button>
    </section>
    ${!banner ? '' : '<div class="adslot"><div class="creative"><i>AD</i>Sample banner creative · adaptive 360×50</div></div>'}
    <div class="gesture"></div>`;
  const up = document.querySelector('.upper'); up.classList.toggle('fade', up.scrollHeight > up.clientHeight + 1);
};
</script>
</head>
<body>
<div class="app" id="app"></div>
</body>
</html>
