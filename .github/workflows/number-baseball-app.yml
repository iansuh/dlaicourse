name: Number Baseball app

on:
  push:
    branches: [claude/number-baseball-game-1u4o9o]
    paths:
      - 'number-baseball-app/**'
      - '.github/workflows/number-baseball-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (core + server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: number-baseball-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Feature branch: the default (read-only on non-default branches) would never fill the cache.
          cache-read-only: false
      - name: Tests
        run: ./gradlew test --stacktrace
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: number-baseball-app/backend/**/build/reports/tests/
          if-no-files-found: ignore

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: number-baseball-app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Android SDK (platform 36, build-tools 36.0.0)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # Runs every JVM, Robolectric and Compose test; screenshot tests compare against app/screenshots (committed).
      - name: Unit, Robolectric and screenshot tests (Roborazzi verify)
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace
      # The following steps run even if an earlier one failed, so one push gives all the feedback.
      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug
      - name: Debug APK
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleDebug
      - name: Release bundle (unsigned, placeholder IDs; checks R8 and resource shrinking)
        if: ${{ !cancelled() }}
        env:
          NB_ALLOW_PLACEHOLDER_RELEASE: 'true'
        run: ./gradlew :app:bundleRelease
      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: number-baseball-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: number-baseball-app/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload test and screenshot reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            number-baseball-app/android/app/build/reports/tests/
            number-baseball-app/android/app/build/reports/roborazzi/
            number-baseball-app/android/app/build/outputs/roborazzi/
          if-no-files-found: ignore
